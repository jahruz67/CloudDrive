name: Build and release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (for example, v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

# Avoid overlapping publication runs.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate bundled signing key and release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          if [[ ! -f .github/signing/cloudapp-release.jks ]]; then
            echo "::error::The permanent signing key is missing. Restore .github/signing/cloudapp-release.jks from Git history; do not generate a different key."
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must look like v1.2.3 or v1.2.3-beta01."
            exit 1
          fi

          # Existing APKs used versionCode 1. Workflow run numbers increase for
          # new releases; rerunning a release intentionally keeps its code.
          version_code=$((RELEASE_RUN_NUMBER + 1))
          if (( version_code < 2 || version_code > 2100000000 )); then
            echo "::error::Release version code is outside Android's supported range."
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_NAME=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean :app:assembleRelease \
            -PreleaseVersionCode="$RELEASE_VERSION_CODE" \
            -PreleaseVersionName="$RELEASE_VERSION_NAME"

      - name: Prepare release asset
        shell: bash
        env:
          ANDROID_SIGNING_ALIAS: cloudapp
          ANDROID_SIGNING_STORE_PASSWORD: cloudapp
          ANDROID_SIGNING_KEY_PASSWORD: cloudapp
        run: |
          set -euo pipefail

          mkdir -p release
          apk_path="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [[ ! -f "$apk_path" ]]; then
            echo "No unsigned release APK was generated. Contents of app/build/outputs:" >&2
            find app/build/outputs -maxdepth 4 -type f -print >&2 || true
            exit 1
          fi

          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$apksigner_path" ]]; then
            echo "Android SDK apksigner was not found." >&2
            exit 1
          fi

          release_apk="release/cloudapp-${RELEASE_TAG}.apk"
          keystore_path=".github/signing/cloudapp-release.jks"
          "$apksigner_path" sign \
            --ks "$keystore_path" \
            --ks-key-alias "$ANDROID_SIGNING_ALIAS" \
            --ks-pass env:ANDROID_SIGNING_STORE_PASSWORD \
            --key-pass env:ANDROID_SIGNING_KEY_PASSWORD \
            --out "$release_apk" \
            "$apk_path"
          "$apksigner_path" verify --verbose --print-certs "$release_apk"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: CloudApp ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: release/*.apk
